# Orphanet data artifact pipeline
#
# Builds data/orphanet.sqlite from live Orphadata XML files, packages it as a
# gzipped SQLite with sha256 + manifest.json, and publishes the three assets to
# a GitHub Release tagged "data-<orphanet_version>".
#
# IMPORTANT — first run:
#   Trigger this workflow manually via the GitHub Actions "Run workflow" button
#   (workflow_dispatch).  Subsequent runs happen automatically every Monday at
#   06:00 UTC, or when ingest code changes are pushed to main.
#
# CONFIGURATION:
#   The default value of ORPHANET_LINK_DATA__RELEASE_REPO in orphanet_link/config.py
#   must match the repository that hosts these releases (e.g. "berntpopp/orphanet-link").

name: Build & Publish Orphanet Data

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    # GitHub does not evaluate `paths:` for tag pushes, so without `branches:`
    # every `vX.Y.Z` tag ran the whole 45-minute data build -- and the `publish`
    # job below is gated on `refs/heads/main`, so such a run could only ever
    # rebuild and fail. Restricting the trigger removes exactly the runs that
    # could never have published anything.
    branches: [main]
    paths:
      - "orphanet_link/ingest/**"

permissions: {}

# GitHub permits multiple draft releases with one tag. Serialize every run for
# a ref so two scheduled/manual publishers cannot create competing drafts.
concurrency:
  group: orphanet-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build SQLite and verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      state: ${{ steps.release_state.outputs.state }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.release_state.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python

      # -----------------------------------------------------------------------
      # 1. Build the database (downloads live Orphadata XML)
      # -----------------------------------------------------------------------
      - name: Build Orphanet database
        run: uv run orphanet-link-data build
        timeout-minutes: 45

      # -----------------------------------------------------------------------
      # 2. Read version metadata from the built DB
      # -----------------------------------------------------------------------
      - name: Extract DB metadata
        id: meta
        run: |
          uv run python - "$GITHUB_OUTPUT" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          from orphanet_link.ingest.release_identity import publication_tag

          with sqlite3.connect("data/orphanet.sqlite") as connection:
              version, orphanet_date = connection.execute(
                  "SELECT orphanet_version, orphanet_date FROM meta WHERE id = 1"
              ).fetchone()
          tag = publication_tag(version, orphanet_date)
          with Path(sys.argv[1]).open("a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)
              print(f"version={version}", file=output)
          print(f"Orphanet version: {version}; revision: {orphanet_date}; tag: {tag}")
          PY

      # -----------------------------------------------------------------------
      # 3. Package deterministic assets before checking for a collision
      # -----------------------------------------------------------------------
      - name: Compress database
        run: |
          gzip -n -kf data/orphanet.sqlite
          ( cd data && sha256sum orphanet.sqlite.gz > orphanet.sqlite.gz.sha256 )

      - name: Write manifest.json
        run: |
          uv run python - <<'EOF'
          import json, sqlite3
          from orphanet_link.constants import SCHEMA_VERSION

          conn = sqlite3.connect("data/orphanet.sqlite")
          conn.row_factory = sqlite3.Row
          row = conn.execute("SELECT * FROM meta WHERE id=1").fetchone()
          conn.close()

          manifest = {
              "version":          row["orphanet_version"],
              "orphanet_date":    row["orphanet_date"],
              "schema_version":   SCHEMA_VERSION,
              "disorder_count":   row["disorder_count"],
              "xref_count":       row["xref_count"],
              "gene_count":       row["gene_count"],
              "phenotype_count":  row["phenotype_count"],
              "prevalence_count": row["prevalence_count"],
              "asset":            "orphanet.sqlite.gz",
          }
          # build_utc is source-derived (see ingest/builder.py::_build_stamp), so it
          # is stable across rebuilds. It stays an OPTIONAL identity field: emit it
          # only when present, never as a null the manifest validator rejects.
          if row["build_utc"]:
              manifest["build_utc"] = row["build_utc"]
          with open("data/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      # -----------------------------------------------------------------------
      # 4. Verify exact identity before allowing any release mutation
      # -----------------------------------------------------------------------
      - name: Prepare exact release assets
        env:
          HANDOFF_DIR: ${{ runner.temp }}/orphanet-release-handoff
        run: |
          mkdir -p "$HANDOFF_DIR/assets" "$HANDOFF_DIR/verifier"
          cp -- data/orphanet.sqlite.gz data/orphanet.sqlite.gz.sha256 data/manifest.json \
            "$HANDOFF_DIR/assets/"
          # The publisher executes only this reviewed, stdlib-only verifier from
          # the immutable build artifact; it never checks out branch-controlled code.
          cp -- orphanet_link/ingest/release_identity.py "$HANDOFF_DIR/verifier/"

      - name: Verify existing release identity
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          CURRENT_RELEASE_DIR: ${{ runner.temp }}/orphanet-release-handoff/assets
        run: |
          set -euo pipefail
          existing_dir="$RUNNER_TEMP/orphanet-existing-release"
          api_get() {
            endpoint="$1"
            output="$2"
            timeout 30s curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-filesize 1048576 --connect-timeout 15 --max-time 30 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$output" "https://api.github.com/$endpoint"
            test "$(wc -c < "$output")" -le 1048576
          }
          uv run python - "$CURRENT_RELEASE_DIR" "$TAG" <<'PY'
          import sys
          from pathlib import Path

          from orphanet_link.ingest.release_identity import read_release_identity

          print(read_release_identity(Path(sys.argv[1]), sys.argv[2]))
          PY
          remote_metadata="$(uv run python -m orphanet_link.ingest.release_assets \
            "$GITHUB_REPOSITORY" "$TAG" "$existing_dir" \
            --expected-dir "$CURRENT_RELEASE_DIR")"
          remote_state="$(python3 - "$remote_metadata" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          if not isinstance(payload, dict) or payload.get("state") not in {"absent", "draft", "draft_partial", "published"}:
              raise SystemExit("release retrieval returned an invalid state")
          print(payload["state"])
          PY
          )"
          case "$remote_state" in
            absent)
              echo "state=create" >> "$GITHUB_OUTPUT"
              echo "Release $TAG does not exist — will create a draft."
              ;;
            published|draft|draft_partial)
              release_id="$(python3 - "$remote_metadata" <<'PY'
          import json, sys
          from orphanet_link.ingest.release_identity import validate_release_id
          payload = json.loads(sys.argv[1])
          try:
              print(validate_release_id(payload.get("release_id")))
          except ValueError as error:
              raise SystemExit(str(error)) from error
          PY
              )"
              remote_json="$RUNNER_TEMP/orphanet-existing-release.json"
              api_get "repos/$GITHUB_REPOSITORY/releases/$release_id" "$remote_json"
              python3 - "$remote_json" "$TAG" "$GITHUB_SHA" "$remote_state" "$release_id" <<'PY'
          import json, sys
          from orphanet_link.ingest.release_identity import validate_release_id
          payload = json.load(open(sys.argv[1]))
          if validate_release_id(payload.get("id")) != int(sys.argv[5]):
              raise SystemExit("release API identity is invalid")
          if payload.get("tag_name") != sys.argv[2]:
              raise SystemExit("release API tag binding is invalid")
          if payload.get("target_commitish") != sys.argv[3]:
              raise SystemExit("release API source binding is invalid")
          if type(payload.get("draft")) is not bool or (payload["draft"] != (sys.argv[4] in {"draft", "draft_partial"})):
              raise SystemExit("release API draft state is invalid")
          if sys.argv[4] == "published" and payload.get("immutable") is not True:
              raise SystemExit("published release is not immutable")
          PY
              source_tag="$RUNNER_TEMP/orphanet-existing-source-tag.json"
              set +e
              timeout 30s gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$source_tag"
              tag_status=$?
              set -e
              test "$(wc -c < "$source_tag")" -le 1048576
              python3 - "$source_tag" "$GITHUB_SHA" "$remote_state" "$tag_status" <<'PY'
          import json, sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          command_status = int(sys.argv[4])
          marker = b"\r\n\r\n"
          header_end = raw.find(marker)
          if header_end < 0:
              marker = b"\n\n"
              header_end = raw.find(marker)
          if header_end < 0:
              raise SystemExit("source tag probe has no HTTP response")
          header = raw[:header_end].decode("ascii", "replace").splitlines()[0].split()
          status = int(header[1]) if len(header) > 1 and header[1].isdigit() else 0
          if status == 404 and command_status != 0:
              if sys.argv[3] in {"draft", "draft_partial"}:
                  print("source tag probe returned 404 for draft")
                  raise SystemExit(0)
              raise SystemExit("published release requires an exact present source tag")
          if status != 200 or command_status != 0:
              raise SystemExit("source tag probe failed")
          target = json.loads(raw[header_end + len(marker) :]).get("object")
          if not isinstance(target, dict) or target.get("type") != "commit" or target.get("sha") != sys.argv[2]:
              raise SystemExit("release tag does not resolve to the exact reviewed source")
          PY
              echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
              if [[ "$remote_state" == "draft_partial" ]]; then
                state="draft_publish_existing"
              else
                state="$(uv run python - "$CURRENT_RELEASE_DIR" "$existing_dir" "$TAG" "$remote_state" <<'PY'
          import sys
          from pathlib import Path

          from orphanet_link.ingest.release_identity import verify_release_identity

          print(verify_release_identity(
              Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], is_draft=sys.argv[4] == "draft"
          ))
          PY
                )"
              fi
              case "$state" in
                published_noop)
                  # A no-op is still an accepted release: require a valid
                  # provenance attestation before recording the state.
                  timeout 120s gh attestation verify "$existing_dir/orphanet.sqlite.gz" \
                    --repo "$GITHUB_REPOSITORY" \
                    --signer-workflow "berntpopp/orphanet-link/.github/workflows/build-data.yml" \
                    --source-ref "refs/heads/main"
                  echo "state=$state" >> "$GITHUB_OUTPUT"
                  echo "Release $TAG has identical verified assets: $state."
                  ;;
                draft_publish_existing)
                  echo "state=$state" >> "$GITHUB_OUTPUT"
                  echo "Release $TAG has identical verified assets: $state."
                  ;;
                collision)
                  echo "Release $TAG exists but its verified identity differs." >&2
                  exit 1
                  ;;
                *)
                  echo "Unexpected release identity state: $state" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unexpected remote release state: $remote_state" >&2
              exit 1
              ;;
          esac

      # -----------------------------------------------------------------------
      # 5. Transfer the exact verified handoff; the writer independently rechecks it.
      # -----------------------------------------------------------------------
      - name: Upload verified release package
        if: steps.release_state.outputs.state == 'create' || steps.release_state.outputs.state == 'draft_publish_existing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orphanet-release-assets
          path: ${{ runner.temp }}/orphanet-release-handoff
          if-no-files-found: error

  publish:
    name: Publish only a verified draft or create package
    needs: build-and-verify
    # Only the protected reviewed main branch may receive contents:write.
    # Tags may exercise the read-only build and verification job, but a tag
    # provenance identity must never be promoted to a release.
    if: github.ref_protected == true && github.ref == 'refs/heads/main' && (needs.build-and-verify.outputs.state == 'draft_publish_existing' || needs.build-and-verify.outputs.state == 'create')
    # The exact tag is a single-writer lease for the privileged publisher.
    # Combined with the final release/tag identity checks, this closes races
    # between concurrent workflow dispatches for the same release.
    concurrency:
      group: orphanet-publish-${{ github.repository }}-${{ needs.build-and-verify.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: data-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact verified release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: orphanet-release-assets
          path: release-package

      - name: Setup pinned Python for the handoff verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Create and upload exact-ID draft
        id: create_draft
        if: needs.build-and-verify.outputs.state == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-and-verify.outputs.tag }}
          VERSION: ${{ needs.build-and-verify.outputs.version }}
        run: |
          set -euo pipefail
          tag_probe="$RUNNER_TEMP/orphanet-create-tag-probe"
          set +e
          timeout 30s gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$tag_probe"
          tag_status=$?
          set -e
          test "$(wc -c < "$tag_probe")" -le 1048576
          python3 - "$tag_probe" "$GITHUB_SHA" "$tag_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          command_status = int(sys.argv[3])
          marker = b"\r\n\r\n"
          header_end = raw.find(marker)
          if header_end < 0:
              marker = b"\n\n"
              header_end = raw.find(marker)
          if header_end < 0:
              raise SystemExit("source tag probe has no HTTP response")
          header = raw[:header_end].decode("ascii", "replace").splitlines()[0].split()
          status = int(header[1]) if len(header) > 1 and header[1].isdigit() else 0
          if status == 404 and command_status != 0:
              raise SystemExit(0)
          if status != 200 or command_status != 0:
              raise SystemExit("source tag probe failed")
          # Release tags must be lightweight commit refs. Reject annotated
          # tag objects rather than following an unbounded indirection chain.
          target = json.loads(raw[header_end + len(marker) :]).get("object")
          if not isinstance(target, dict) or target.get("type") != "commit" or target.get("sha") != sys.argv[2]:
              raise SystemExit("pre-existing source tag does not resolve to the reviewed source")
          PY
          created_json="$RUNNER_TEMP/orphanet-created-release.json"
          timeout 30s gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$TAG" \
            -f "target_commitish=$GITHUB_SHA" \
            -f "name=Orphanet data $VERSION" \
            -f 'body=Prebuilt Orphanet SQLite database. Data: Orphadata CC BY 4.0, © INSERM.' \
            -F draft=true > "$created_json"
          test "$(wc -c < "$created_json")" -le 1048576
          release_id="$(python3 - "$created_json" "$TAG" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1]))
          if not isinstance(release, dict):
              raise SystemExit("created release response is not an object")
          release_id = release.get("id")
          if type(release_id) is not int or not 0 < release_id <= 2**63 - 1:
              raise SystemExit("created release response lacks a numeric API identity")
          if (
              release.get("tag_name") != sys.argv[2]
              or release.get("target_commitish") != sys.argv[3]
              or release.get("draft") is not True
          ):
              raise SystemExit("created release is not the expected source-bound draft")
          print(release_id)
          PY
          )"
          api_get() {
            endpoint="$1"
            output="$2"
            timeout 30s curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-filesize 1048576 --connect-timeout 15 --max-time 30 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$output" "https://api.github.com/$endpoint"
            test "$(wc -c < "$output")" -le 1048576
          }
          upload_asset() {
            name="$1"
            content_type="$2"
            path="$3"
            case "$name:$content_type:$path" in
              "orphanet.sqlite.gz:application/gzip:release-package/assets/orphanet.sqlite.gz"|\
              "orphanet.sqlite.gz.sha256:text/plain:release-package/assets/orphanet.sqlite.gz.sha256"|\
              "manifest.json:application/json:release-package/assets/manifest.json") ;;
              *) echo "unallowlisted release asset" >&2; exit 1 ;;
            esac
            response="$RUNNER_TEMP/orphanet-upload-response"
            timeout 120s curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --max-filesize 1048576 \
              --connect-timeout 15 --max-time 120 --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: $content_type" \
              --data-binary "@$path" \
              --output "$response" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name"
            test "$(wc -c < "$response")" -le 1048576
          }
          upload_asset "orphanet.sqlite.gz" "application/gzip" "release-package/assets/orphanet.sqlite.gz"
          upload_asset "orphanet.sqlite.gz.sha256" "text/plain" "release-package/assets/orphanet.sqlite.gz.sha256"
          upload_asset "manifest.json" "application/json" "release-package/assets/manifest.json"
          refetched_json="$RUNNER_TEMP/orphanet-refetched-release.json"
          api_get "repos/$GITHUB_REPOSITORY/releases/$release_id" "$refetched_json"
          python3 - "$refetched_json" "$release_id" "$TAG" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1]))
          if type(release.get("id")) is not int or release["id"] != int(sys.argv[2]):
              raise SystemExit("release API identity changed unexpectedly")
          if (
              release.get("tag_name") != sys.argv[3]
              or release.get("target_commitish") != sys.argv[4]
              or release.get("draft") is not True
          ):
              raise SystemExit("created release is not the expected source-bound draft")
          PY
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Attest the exact release subject
        if: needs.build-and-verify.outputs.state == 'create' || needs.build-and-verify.outputs.state == 'draft_publish_existing'
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: release-package/assets/orphanet.sqlite.gz

      - name: Publish exact rechecked draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-and-verify.outputs.tag }}
          RELEASE_ID: ${{ needs.build-and-verify.outputs.release_id || steps.create_draft.outputs.release_id }}
        run: |
          set -euo pipefail
          local_dir="$PWD/release-package/assets"
          verifier="$PWD/release-package/verifier/release_identity.py"
          test -f "$verifier"
          test ! -L "$verifier"
          test "$(find "$local_dir" -maxdepth 1 -type f | wc -l)" -eq 3
          release_id="$RELEASE_ID"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          python3 - "$release_id" <<'PY'
          import sys
          if int(sys.argv[1]) > 2**63 - 1:
              raise SystemExit("release ID exceeds the safe bound")
          PY

          api_get() {
            endpoint="$1"
            output="$2"
            timeout 30s curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --max-filesize 1048576 --connect-timeout 15 --max-time 30 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$output" "https://api.github.com/$endpoint"
            test "$(wc -c < "$output")" -le 1048576
          }

          upload_asset() {
            name="$1"
            case "$name" in
              orphanet.sqlite.gz) content_type="application/gzip" ;;
              orphanet.sqlite.gz.sha256) content_type="text/plain" ;;
              manifest.json) content_type="application/json" ;;
              *) echo "unallowlisted release asset" >&2; exit 1 ;;
            esac
            response="$RUNNER_TEMP/orphanet-upload-response"
            timeout 120s curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
              --max-filesize 1048576 \
              --connect-timeout 15 --max-time 120 --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: $content_type" \
              --data-binary "@$local_dir/$name" \
              --output "$response" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name"
            test "$(wc -c < "$response")" -le 1048576
          }

          upload_missing_assets() {
            release_json="$RUNNER_TEMP/orphanet-upload-release.json"
            api_get "repos/$GITHUB_REPOSITORY/releases/$release_id" "$release_json"
            missing="$RUNNER_TEMP/orphanet-missing-assets"
            python3 - "$release_json" "$TAG" "$GITHUB_SHA" "$local_dir" > "$missing" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def file_facts(path: Path) -> tuple[int, str]:
              digest = hashlib.sha256()
              size = 0
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      size += len(chunk)
                      if size > 4 * 1024**3:
                          raise SystemExit(f"asset exceeds size bound: {path.name}")
                      digest.update(chunk)
              return size, digest.hexdigest()

          payload = json.load(open(sys.argv[1]))
          if type(payload.get("id")) is not int or payload["id"] != int(os.environ["RELEASE_ID"]):
              raise SystemExit("release API identity changed unexpectedly")
          if payload.get("tag_name") != sys.argv[2] or payload.get("target_commitish") != sys.argv[3]:
              raise SystemExit("release source identity changed unexpectedly")
          if payload.get("draft") is not True:
              raise SystemExit("release is not a draft")
          expected = {"manifest.json", "orphanet.sqlite.gz", "orphanet.sqlite.gz.sha256"}
          assets = payload.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("release asset inventory is invalid")
          names = set()
          ids = set()
          local_dir = Path(sys.argv[4])
          for asset in assets:
              if not isinstance(asset, dict) or asset.get("name") not in expected:
                  raise SystemExit("release asset inventory contains an unexpected asset")
              name = asset["name"]
              if (
                  name in names
                  or type(asset.get("id")) is not int
                  or not 0 < asset["id"] <= 2**63 - 1
                  or asset["id"] in ids
              ):
                  raise SystemExit("release asset inventory contains a duplicate or invalid asset")
              names.add(name)
              ids.add(asset["id"])
              max_bytes = 4 * 1024**3 if asset["name"] == "orphanet.sqlite.gz" else 1 << 20
              if type(asset.get("size")) is not int or asset["size"] < 0 or asset["size"] > max_bytes:
                  raise SystemExit(f"remote asset exceeds its per-asset size bound: {name}")
              path = local_dir / name
              size, digest = file_facts(path)
              if asset.get("url") != f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}":
                  raise SystemExit(f"existing asset {name} URL is not bound to its ID")
              if (
                  asset.get("size") != size
                  or not isinstance(asset.get("digest"), str)
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", asset["digest"]) is None
                  or asset["digest"] != f"sha256:{digest}"
              ):
