# Orphanet data artifact pipeline
#
# Builds data/orphanet.sqlite from live Orphadata XML files, packages it as a
# gzipped SQLite with sha256 + manifest.json, and publishes the three assets to
# a GitHub Release tagged "data-<orphanet_version>".
#
# IMPORTANT — first run:
#   Trigger this workflow manually via the GitHub Actions "Run workflow" button
#   (workflow_dispatch).  Subsequent runs happen automatically every Monday at
#   06:00 UTC, or when ingest code changes are pushed.
#
# CONFIGURATION:
#   The default value of ORPHANET_LINK_DATA__RELEASE_REPO in orphanet_link/config.py
#   must match the repository that hosts these releases (e.g. "berntpopp/orphanet-link").

name: Build & Publish Orphanet Data

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "orphanet_link/ingest/**"

permissions: {}

# GitHub permits multiple draft releases with one tag. Serialize every run for
# a ref so two scheduled/manual publishers cannot create competing drafts.
concurrency:
  group: orphanet-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build SQLite and verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      state: ${{ steps.release_state.outputs.state }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python

      # -----------------------------------------------------------------------
      # 1. Build the database (downloads live Orphadata XML)
      # -----------------------------------------------------------------------
      - name: Build Orphanet database
        run: uv run orphanet-link-data build
        timeout-minutes: 45

      # -----------------------------------------------------------------------
      # 2. Read version metadata from the built DB
      # -----------------------------------------------------------------------
      - name: Extract DB metadata
        id: meta
        run: |
          uv run python - "$GITHUB_OUTPUT" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          from orphanet_link.ingest.release_identity import publication_tag

          with sqlite3.connect("data/orphanet.sqlite") as connection:
              version, orphanet_date = connection.execute(
                  "SELECT orphanet_version, orphanet_date FROM meta WHERE id = 1"
              ).fetchone()
          tag = publication_tag(version, orphanet_date)
          with Path(sys.argv[1]).open("a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)
              print(f"version={version}", file=output)
          print(f"Orphanet version: {version}; revision: {orphanet_date}; tag: {tag}")
          PY

      # -----------------------------------------------------------------------
      # 3. Package deterministic assets before checking for a collision
      # -----------------------------------------------------------------------
      - name: Compress database
        run: |
          gzip -n -kf data/orphanet.sqlite
          ( cd data && sha256sum orphanet.sqlite.gz > orphanet.sqlite.gz.sha256 )

      - name: Write manifest.json
        run: |
          uv run python - <<'EOF'
          import json, sqlite3
          from datetime import datetime, timezone
          from orphanet_link.constants import SCHEMA_VERSION

          conn = sqlite3.connect("data/orphanet.sqlite")
          conn.row_factory = sqlite3.Row
          row = conn.execute("SELECT * FROM meta WHERE id=1").fetchone()
          conn.close()

          manifest = {
              "version":          row["orphanet_version"],
              "orphanet_date":    row["orphanet_date"],
              "schema_version":   SCHEMA_VERSION,
              "disorder_count":   row["disorder_count"],
              "xref_count":       row["xref_count"],
              "gene_count":       row["gene_count"],
              "phenotype_count":  row["phenotype_count"],
              "prevalence_count": row["prevalence_count"],
              "build_utc":        row["build_utc"],
              "asset":            "orphanet.sqlite.gz",
          }
          with open("data/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      # -----------------------------------------------------------------------
      # 4. Verify exact identity before allowing any release mutation
      # -----------------------------------------------------------------------
      - name: Prepare exact release assets
        env:
          HANDOFF_DIR: ${{ runner.temp }}/orphanet-release-handoff
        run: |
          mkdir -p "$HANDOFF_DIR/assets" "$HANDOFF_DIR/verifier"
          cp -- data/orphanet.sqlite.gz data/orphanet.sqlite.gz.sha256 data/manifest.json \
            "$HANDOFF_DIR/assets/"
          # The publisher executes only this reviewed, stdlib-only verifier from
          # the immutable build artifact; it never checks out branch-controlled code.
          cp -- orphanet_link/ingest/release_identity.py "$HANDOFF_DIR/verifier/"

      - name: Verify existing release identity
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          CURRENT_RELEASE_DIR: ${{ runner.temp }}/orphanet-release-handoff/assets
        run: |
          set -euo pipefail
          existing_dir="$RUNNER_TEMP/orphanet-existing-release"
          uv run python - "$CURRENT_RELEASE_DIR" "$TAG" <<'PY'
          import sys
          from pathlib import Path

          from orphanet_link.ingest.release_identity import read_release_identity

          print(read_release_identity(Path(sys.argv[1]), sys.argv[2]))
          PY
          remote_metadata="$(uv run python -m orphanet_link.ingest.release_assets \
            "$GITHUB_REPOSITORY" "$TAG" "$existing_dir")"
          remote_state="$(python3 - "$remote_metadata" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          if not isinstance(payload, dict) or payload.get("state") not in {"absent", "draft", "published"}:
              raise SystemExit("release retrieval returned an invalid state")
          print(payload["state"])
          PY
          )"
          case "$remote_state" in
            absent)
              echo "state=create" >> "$GITHUB_OUTPUT"
              echo "Release $TAG does not exist — will create a draft."
              ;;
            published|draft)
              release_id="$(python3 - "$remote_metadata" <<'PY'
          import json, sys
          from orphanet_link.ingest.release_identity import validate_release_id
          payload = json.loads(sys.argv[1])
          try:
              print(validate_release_id(payload.get("release_id")))
          except ValueError as error:
              raise SystemExit(str(error)) from error
          PY
              )"
              remote_json="$RUNNER_TEMP/orphanet-existing-release.json"
              timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$remote_json"
              test "$(wc -c < "$remote_json")" -le 1048576
              python3 - "$remote_json" "$TAG" "$GITHUB_SHA" "$remote_state" <<'PY'
          import json, sys
          from orphanet_link.ingest.release_identity import validate_release_id
          payload = json.load(open(sys.argv[1]))
          if validate_release_id(payload.get("id")) <= 0:
              raise SystemExit("release API identity is invalid")
          if payload.get("tag_name") != sys.argv[2]:
              raise SystemExit("release API tag binding is invalid")
          if payload.get("target_commitish") != sys.argv[3]:
              raise SystemExit("release API source binding is invalid")
          if type(payload.get("draft")) is not bool or (payload["draft"] != (sys.argv[4] == "draft")):
              raise SystemExit("release API draft state is invalid")
          if sys.argv[4] == "published" and payload.get("immutable") is not True:
              raise SystemExit("published release is not immutable")
          PY
              source_tag="$RUNNER_TEMP/orphanet-existing-source-tag.json"
              timeout 30s gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$source_tag"
              test "$(wc -c < "$source_tag")" -le 1048576
              python3 - "$source_tag" "$GITHUB_SHA" <<'PY'
          import json, sys
          target = json.load(open(sys.argv[1])).get("object")
          if not isinstance(target, dict) or target.get("type") != "commit" or target.get("sha") != sys.argv[2]:
              raise SystemExit("release tag does not resolve to the exact reviewed source")
          PY
              state="$(uv run python - "$CURRENT_RELEASE_DIR" "$existing_dir" "$TAG" "$remote_state" <<'PY'
          import sys
          from pathlib import Path

          from orphanet_link.ingest.release_identity import verify_release_identity

          print(verify_release_identity(
              Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], is_draft=sys.argv[4] == "draft"
          ))
          PY
              )"
              case "$state" in
                published_noop)
                  # A no-op is still an accepted release: require a valid
                  # provenance attestation before recording the state.
                  timeout 120s gh attestation verify "$existing_dir/orphanet.sqlite.gz" \
                    --repo "$GITHUB_REPOSITORY" \
                    --signer-workflow "berntpopp/orphanet-link/.github/workflows/build-data.yml" \
                    --source-ref "refs/heads/main"
                  echo "state=$state" >> "$GITHUB_OUTPUT"
                  echo "Release $TAG has identical verified assets: $state."
                  ;;
                draft_publish_existing)
                  echo "state=$state" >> "$GITHUB_OUTPUT"
                  echo "Release $TAG has identical verified assets: $state."
                  ;;
                collision)
                  echo "Release $TAG exists but its verified identity differs." >&2
                  exit 1
                  ;;
                *)
                  echo "Unexpected release identity state: $state" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unexpected remote release state: $remote_state" >&2
              exit 1
              ;;
          esac

      # -----------------------------------------------------------------------
      # 5. Transfer the exact verified handoff; the writer independently rechecks it.
      # -----------------------------------------------------------------------
      - name: Upload verified release package
        if: steps.release_state.outputs.state == 'create' || steps.release_state.outputs.state == 'draft_publish_existing'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orphanet-release-assets
          path: ${{ runner.temp }}/orphanet-release-handoff
          if-no-files-found: error

  publish:
    name: Publish only a verified draft or create package
    needs: build-and-verify
    # Only the protected reviewed main branch may receive contents:write.
    # Tags may exercise the read-only build and verification job, but a tag
    # provenance identity must never be promoted to a release.
    if: github.ref_protected == true && github.ref == 'refs/heads/main' && (needs.build-and-verify.outputs.state == 'draft_publish_existing' || needs.build-and-verify.outputs.state == 'create')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: data-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact verified release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: orphanet-release-assets
          path: release-package

      - name: Setup pinned Python for the handoff verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Atomically create a new draft
        id: create_draft
        if: needs.build-and-verify.outputs.state == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-and-verify.outputs.tag }}
          VERSION: ${{ needs.build-and-verify.outputs.version }}
        run: |
          set -euo pipefail
          inventory_tag() {
            output="$1"
            : > "$output"
            complete=false
            for page in $(seq 1 10); do
              page_json="$RUNNER_TEMP/orphanet-release-page-$page.json"
              timeout 30s gh api \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" > "$page_json"
              test "$(wc -c < "$page_json")" -le 8388608
              count="$(python3 - "$page_json" "$TAG" "$output" <<'PY'
          import json
          import sys

          page = json.load(open(sys.argv[1]))
          if not isinstance(page, list) or len(page) > 100:
              raise SystemExit("release inventory page is invalid")
          with open(sys.argv[3], "a", encoding="utf-8") as matches:
              for release in page:
                  if not isinstance(release, dict):
                      raise SystemExit("release inventory item is invalid")
                  if release.get("tag_name") == sys.argv[2]:
                      print(json.dumps(release, separators=(",", ":")), file=matches)
          print(len(page))
          PY
              )"
              if [ "$count" -lt 100 ]; then complete=true; break; fi
            done
            test "$complete" = true
          }

          before="$RUNNER_TEMP/orphanet-release-before.jsonl"
          after="$RUNNER_TEMP/orphanet-release-after.jsonl"
          inventory_tag "$before"
          if [ -s "$before" ]; then
            echo "writer inventory found an existing exact-tag release before create" >&2
            exit 1
          fi
          tag_probe="$RUNNER_TEMP/orphanet-create-tag-probe"
          set +e
          timeout 30s gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$tag_probe"
          tag_status=$?
          set -e
          test "$(wc -c < "$tag_probe")" -le 1048576
          python3 - "$tag_probe" "$GITHUB_SHA" "$tag_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          command_status = int(sys.argv[3])
          marker = b"\r\n\r\n"
          header_end = raw.find(marker)
          if header_end < 0:
              marker = b"\n\n"
              header_end = raw.find(marker)
          if header_end < 0:
              raise SystemExit("source tag probe has no HTTP response")
          header = raw[:header_end].decode("ascii", "replace").splitlines()[0].split()
          status = int(header[1]) if len(header) > 1 and header[1].isdigit() else 0
          if status == 404 and command_status != 0:
              raise SystemExit(0)
          if status != 200 or command_status != 0:
              raise SystemExit("source tag probe failed")
          target = json.loads(raw[header_end + len(marker) :]).get("object")
          if not isinstance(target, dict) or target.get("type") != "commit" or target.get("sha") != sys.argv[2]:
              raise SystemExit("pre-existing source tag does not resolve to the reviewed source")
          PY
          timeout 120s gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Orphanet data $VERSION" \
            --notes "Prebuilt Orphanet SQLite database. Data: Orphadata CC BY 4.0, © INSERM." \
            --draft \
            release-package/assets/orphanet.sqlite.gz \
            release-package/assets/orphanet.sqlite.gz.sha256 \
            release-package/assets/manifest.json
          inventory_tag "$after"
          release_id="$(python3 - "$after" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          lines = [line for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          if len(lines) != 1:
              raise SystemExit("writer inventory did not find exactly one created release")
          release = json.loads(lines[0])
          release_id = release.get("id")
          if type(release_id) is not int or not 0 < release_id <= 2**63 - 1:
              raise SystemExit("created release lacks a numeric API identity")
          if release.get("draft") is not True or release.get("target_commitish") != sys.argv[2]:
              raise SystemExit("created release is not the expected source-bound draft")
          assets = release.get("assets")
          expected = {"manifest.json", "orphanet.sqlite.gz", "orphanet.sqlite.gz.sha256"}
          if not isinstance(assets, list) or len(assets) != 3 or {a.get("name") for a in assets} != expected:
              raise SystemExit("created release has an unexpected asset inventory")
          print(release_id)
          PY
          )"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Bind existing exact draft ID
        id: bind_existing
        if: needs.build-and-verify.outputs.state == 'draft_publish_existing'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-and-verify.outputs.tag }}
        run: |
          set -euo pipefail
          matches="$RUNNER_TEMP/orphanet-existing-draft.jsonl"
          : > "$matches"
          complete=false
          for page in $(seq 1 10); do
            page_json="$RUNNER_TEMP/orphanet-existing-page-$page.json"
            timeout 30s gh api \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" > "$page_json"
            test "$(wc -c < "$page_json")" -le 8388608
            count="$(python3 - "$page_json" "$TAG" "$matches" <<'PY'
          import json
          import sys

          page = json.load(open(sys.argv[1]))
          if not isinstance(page, list) or len(page) > 100:
              raise SystemExit("release inventory page is invalid")
          with open(sys.argv[3], "a", encoding="utf-8") as output:
              for release in page:
                  if not isinstance(release, dict):
                      raise SystemExit("release inventory item is invalid")
                  if release.get("tag_name") == sys.argv[2]:
                      print(json.dumps(release, separators=(",", ":")), file=output)
          print(len(page))
          PY
            )"
            if [ "$count" -lt 100 ]; then complete=true; break; fi
          done
          test "$complete" = true
          release_id="$(python3 - "$matches" <<'PY'
          import json
          import sys

          lines = [line for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          if len(lines) != 1:
              raise SystemExit("writer inventory did not find exactly one existing draft")
          release = json.loads(lines[0])
          release_id = release.get("id")
          if (
              type(release_id) is not int
              or not 0 < release_id <= 2**63 - 1
              or release.get("draft") is not True
          ):
              raise SystemExit("existing release is not one exact numeric draft")
          print(release_id)
          PY
          )"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Attest the exact release subject
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: release-package/assets/orphanet.sqlite.gz

      - name: Publish exact rechecked draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-and-verify.outputs.tag }}
          RELEASE_ID: ${{ steps.create_draft.outputs.release_id || steps.bind_existing.outputs.release_id }}
        run: |
          set -euo pipefail
          local_dir="$PWD/release-package/assets"
          verifier="$PWD/release-package/verifier/release_identity.py"
          test -f "$verifier"
          test ! -L "$verifier"
          test "$(find "$local_dir" -maxdepth 1 -type f | wc -l)" -eq 3
          release_id="$RELEASE_ID"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          python3 - "$release_id" <<'PY'
          import sys
          if int(sys.argv[1]) > 2**63 - 1:
              raise SystemExit("release ID exceeds the safe bound")
          PY

          verify_remote() {
            expected_draft="$1"
            remote_dir="$(mktemp -d "$RUNNER_TEMP/orphanet-publisher-recheck.XXXXXX")"
            release_json="${remote_dir}.json"
            source_tag="${remote_dir}.tag.json"
            timeout 30s gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$source_tag"
            test "$(wc -c < "$source_tag")" -le 1048576
            python3 - "$source_tag" "$GITHUB_SHA" <<'PY'
          import json, sys
          target = json.load(open(sys.argv[1])).get("object")
          if not isinstance(target, dict) or target.get("type") != "commit" or target.get("sha") != sys.argv[2]:
              raise SystemExit("source tag does not resolve to the exact reviewed source")
          PY
            timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
            test "$(wc -c < "$release_json")" -le 1048576
            python3 - "$release_json" "$expected_draft" <<'PY'
          import json
          import os
          import sys
          payload = json.load(open(sys.argv[1]))
          if type(payload.get("id")) is not int or payload["id"] != int(os.environ["RELEASE_ID"]):
              raise SystemExit("release API identity changed unexpectedly")
          if payload.get("tag_name") != os.environ.get("TAG"):
              raise SystemExit("release tag binding changed unexpectedly")
          if payload.get("target_commitish") != os.environ.get("GITHUB_SHA"):
              raise SystemExit("release source binding changed unexpectedly")
          if payload.get("draft") is not (sys.argv[2] == "true"):
              raise SystemExit("release draft state changed unexpectedly")
          if sys.argv[2] == "false" and payload.get("immutable") is not True:
              raise SystemExit("published release is not immutable")
          assets = payload.get("assets")
          expected = {"manifest.json", "orphanet.sqlite.gz", "orphanet.sqlite.gz.sha256"}
          if not isinstance(assets, list) or len(assets) != 3 or {a.get("name") for a in assets} != expected:
              raise SystemExit("release asset inventory is not exactly the three-asset contract")
          for asset in assets:
              if (
                  type(asset.get("id")) is not int
                  or not 0 < asset["id"] <= 2**63 - 1
                  or type(asset.get("size")) is not int
                  or asset["size"] < 0
                  or asset["size"] > 4 * 1024**3
                  or not isinstance(asset.get("digest"), str)
              ):
                  raise SystemExit("release asset lacks immutable id/digest metadata")
              if not asset["digest"].startswith("sha256:"):
                  raise SystemExit("release asset digest is not sha256")
          PY
            ulimit -f 8388608
            for asset in manifest.json orphanet.sqlite.gz orphanet.sqlite.gz.sha256; do
              asset_id="$(python3 - "$release_json" "$asset" <<'PY'
          import json, sys
          for item in json.load(open(sys.argv[1]))["assets"]:
              if item["name"] == sys.argv[2]:
                  print(item["id"])
                  break
          else:
              raise SystemExit("asset ID is missing")
          PY
              )"
              test -n "$asset_id"
              timeout 120s gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                --header "Accept: application/octet-stream" > "$remote_dir/$asset"
            done
            test "$(find "$remote_dir" -maxdepth 1 -type f | wc -l)" -eq 3
            python3 - "$release_json" "$remote_dir" "$local_dir" "$TAG" "$verifier" "$expected_draft" <<'PY'
          import hashlib
          import json
          import runpy
          import sys
          from pathlib import Path

          release_json, remote, local, tag, verifier, expected_draft = sys.argv[1:]
          module = runpy.run_path(verifier)
          local_identity = module["read_release_identity"](Path(local), tag)
          state = module["verify_release_identity"](
              Path(local), Path(remote), tag, is_draft=(expected_draft == "true")
          )
          if state not in {"draft_publish_existing", "published_noop"}:
              raise SystemExit("remote draft identity differs from the sealed handoff")
          payload = json.load(open(release_json))
          by_name = {a["name"]: a for a in payload["assets"]}
          for name, asset in by_name.items():
              path = Path(remote) / name
              if path.stat().st_size != asset["size"]:
                  raise SystemExit(f"remote asset size changed: {name}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if asset["digest"] != f"sha256:{digest}":
                  raise SystemExit(f"remote asset digest changed: {name}")
              if path.read_bytes() != (Path(local) / name).read_bytes():
                  raise SystemExit(f"remote asset bytes changed: {name}")
          if local_identity.tag != tag:
              raise SystemExit("sealed handoff tag mismatch")
          PY
            timeout 120s gh attestation verify "$remote_dir/orphanet.sqlite.gz" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "berntpopp/orphanet-link/.github/workflows/build-data.yml" \
              --source-ref "refs/heads/main"
          }

          # Recheck the exact numeric API identity and every byte immediately
          # before promotion, then promote and recheck that same identity.
          verify_remote true
          timeout 30s gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false \
            > "$RUNNER_TEMP/orphanet-promotion.json"
          test "$(wc -c < "$RUNNER_TEMP/orphanet-promotion.json")" -le 1048576
          verify_remote false
          timeout 30s gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            > "$RUNNER_TEMP/orphanet-release-tag.json"
          test "$(wc -c < "$RUNNER_TEMP/orphanet-release-tag.json")" -le 1048576
          python3 - "$RUNNER_TEMP/orphanet-release-tag.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          tag = json.load(open(sys.argv[1]))
          target = tag.get("object")
          if not isinstance(target, dict) or target.get("type") != "commit" or target.get("sha") != sys.argv[2]:
              raise SystemExit("published tag does not resolve to the exact reviewed source")
          PY
